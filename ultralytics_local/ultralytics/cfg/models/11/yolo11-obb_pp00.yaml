# Ultralytics YOLO11-obb Oriented Bounding Boxes (OBB) model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-obb.yaml' will call yolo11-obb.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 344 layers, 2695747 parameters, 2695731 gradients, 6.9 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 344 layers, 9744931 parameters, 9744915 gradients, 22.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 434 layers, 20963523 parameters, 20963507 gradients, 72.2 GFLOPs
  l: [1.00, 1.00, 512] # summary: 656 layers, 26220995 parameters, 26220979 gradients, 91.3 GFLOPs
  x: [1.00, 1.50, 512] # summary: 656 layers, 58875331 parameters, 58875315 gradients, 204.3 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]             # 0 P1/2
  - [-1, 1, ViTBlock1PP, [128, 2]]         # 1 P2/4
  - [-1, 1, ViTBlock1PPRep, [128, 1]]     # 2 P2.1/4
  - [-1, 1, ViTBlock1PP, [256, 2]]         # 3 P3/8
  - [-1, 1, ViTBlock1PPRep, [256, 2]]     # 4 P3.1/8
  - [-1, 1, ViTBlock1PP, [512, 2]]         # 5 P4/16
  - [-1, 1, ViTBlock1PPRep, [512, 2]]     # 6 P4.1/16
  - [-1, 1, SPPF, [512, 5]]               # 7
  - [-1, 2, C2PSA, [512]]                # 8 P4.n/16

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9 /8
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3.1
  - [-1, 1, ViTBlock1PPRep, [256, 2]] # 11 HP0/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12 /4
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2.1
  - [-1, 1, ViTBlock1PPRep, [64, 1]] # 14 (HP3/4-small)

  - [-1, 1, ViTBlock1PP, [128, 2]] # 15 /8
  - [[-1, 11], 1, Concat, [1]] # cat HP0
  - [-1, 1, ViTBlock1PPRep, [128, 2]] # 17 (HP4/8-medium)

  - [-1, 1, ViTBlock1PP, [256, 2]] # 18 /16
  - [[-1, 8], 1, Concat, [1]] # cat P4.n
  - [-1, 1, ViTBlock1PPRep, [256, 2]] # 20 (HP5/16-large)

  - [-1, 1, ViTBlock1PP, [512, 2]] # 21 /32

  - [[15, 18, 21], 1, OBB, [nc, 1]] # Detect(P3, P4, P5)
